# pnpm settings. This is not a workspace — there is one package here — but pnpm 11 no longer reads
# the `pnpm` field in package.json, so its configuration lives in this file regardless.

# Which dependencies may run install scripts.
#
# Without this, pnpm 11 skips every native package's build step (ERR_PNPM_IGNORED_BUILDS). Prisma is
# the one that actually breaks: its postinstall fetches the query engine and generates the client, so
# skipping it fails at runtime rather than at install time. sharp and @parcel/watcher are native too —
# Next uses them for image optimisation and file watching.
allowBuilds:
    '@parcel/watcher': true
    '@prisma/client': true
    '@prisma/engines': true
    prisma: true
    sharp: true
    # Native module resolver behind eslint-plugin-import; without its build step ESLint's
    # import resolution falls back to a slower JS path.
    unrs-resolver: true

# Refuse lockfile entries published in the last 24 hours (the value is in minutes).
#
# A supply-chain guard carried over from dr-pam: when a package is compromised, the malicious version
# is usually pulled within hours, so declining to be the first to install anything brand new removes
# most of the exposure for almost no cost. When a dependency is too new to install, downgrade it to a
# version that has aged past this window rather than removing the setting.
minimumReleaseAge: 1440
